<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Auth - Verificação</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #09090b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Animações Gerais */
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeOut {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0; display: none; }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(220, 38, 38, 0.3); }
      50% { box-shadow: 0 0 40px rgba(220, 38, 38, 0.6); }
      100% { box-shadow: 0 0 20px rgba(220, 38, 38, 0.3); }
    }

    @keyframes successGlow {
      0% { box-shadow: 0 0 25px rgba(34, 197, 94, 0.2); }
      50% { box-shadow: 0 0 50px rgba(34, 197, 94, 0.5); }
      100% { box-shadow: 0 0 25px rgba(34, 197, 94, 0.2); }
    }

    @keyframes stroke {
      100% { stroke-dashoffset: 0; }
    }

    @keyframes scaleCheck {
      0%, 100% { transform: none; }
      50% { transform: scale3d(1.1, 1.1, 1); }
    }

    /* Painel Inicial (Botão Vermelho) */
    .verify-container {
      text-align: center;
      background: #111113;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 20px;
      padding: 60px 40px;
      max-width: 440px;
      width: 90%;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, pulseGlow 3s infinite;
      transition: all 0.4s ease;
    }

    .verify-container.hidden {
      animation: fadeOut 0.4s forwards;
      pointer-events: none;
    }

    .verify-title {
      color: #ffffff;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .verify-subtitle {
      color: #a1a1aa;
      font-size: 15px;
      margin-bottom: 35px;
      line-height: 1.5;
    }

    .btn-red {
      display: inline-block;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      padding: 16px 32px;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4);
      width: 100%;
      cursor: pointer;
    }

    .btn-red:hover {
      background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.6);
    }

    .btn-red:active {
      transform: translateY(-1px);
    }

    /* Painel de Sucesso (Oculto inicialmente) */
    .success-card {
      position: absolute;
      display: none;
      background: #111113;
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: 20px;
      padding: 50px 40px;
      text-align: center;
      max-width: 440px;
      width: 90%;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, successGlow 3s infinite;
    }

    .checkmark-circle {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px auto;
    }

    .checkmark {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      stroke-width: 3;
      stroke: #22c55e;
      stroke-miterlimit: 10;
      animation: scaleCheck .4s ease-in-out .8s both;
    }

    .checkmark-check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: stroke 0.5s cubic-bezier(0.65, 0, 0.45, 1) 0.3s forwards;
    }

    .success-title {
      color: #22c55e;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .success-text {
      color: #a1a1aa;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn-success {
      display: inline-block;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      padding: 15px 28px;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
      width: 100%;
    }

    .btn-success:hover {
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.5);
    }
  </style>
</head>
<body>

  <!-- TELA 1: O Botão Vermelho Gigante e Estético -->
  <div id="verifyView" class="verify-container">
    <h2 class="verify-title">Blood Auth</h2>
    <p class="verify-subtitle">Clique no botão abaixo para concluir sua verificação de segurança no servidor.</p>
    
    <!-- Link de redirecionamento do Discord -->
    <a href="https://discord.com/oauth2/authorize?client_id=1542028507796865024&response_type=code&redirect_uri=https%3A%2F%2Fbrieniopantes.github.io%2Findex.html%2F&scope=identify+guilds.join" 
       class="btn-red" 
       id="verifyBtn">
       Concluir Verificação
    </a>
  </div>

  <!-- TELA 2: Painel de Sucesso Centralizado -->
  <div id="successView" class="success-card">
    <div class="checkmark-circle">
      <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="23" fill="none" stroke="#22c55e" stroke-width="2.5"/>
        <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
      </svg>
    </div>
    <h2 class="success-title">Verificado com Sucesso!</h2>
    <p class="success-text">Sua conta foi autenticada perfeitamente no <strong>Blood Auth</strong>.</p>
    
    <!-- Botão de Voltar para o Servidor -->
    <a href="https://discord.com" class="btn-success" id="returnBtn">Voltar para o Servidor</a>
  </div>

  <script>
    const verifyBtn = document.getElementById('verifyBtn');
    const verifyView = document.getElementById('verifyView');
    const successView = document.getElementById('successView');

    verifyBtn.addEventListener('click', function(e) {
      // Se quiser simular a transição direto na tela antes de ir pro Discord, 
      // descomente a linha abaixo (mas o padrão do OAuth vai abrir o link do Discord):
      
      // e.preventDefault(); 
      
      setTimeout(() => {
        verifyView.classList.add('hidden');
        setTimeout(() => {
          verifyView.style.display = 'none';
          successView.style.display = 'block';
        }, 300);
      }, 150);
    });
  </script>

</body>
</html>
